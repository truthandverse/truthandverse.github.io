<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok connection</title>
<link rel="icon" href="icone.png"><style>
:root{--bg:#0f1a2e;--txt:#e9e4d8;--ouro:#d9b66c}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.6 Georgia,serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}h1{color:var(--ouro);font-weight:normal}
code{display:block;word-break:break-all;background:#16233d;padding:12px;border-radius:8px;font-size:14px}
button{margin-top:12px;background:var(--ouro);color:#0f1a2e;border:0;border-radius:8px;padding:10px 18px;font-size:16px;cursor:pointer}
img.logo{width:72px;height:72px;border-radius:50%}
</style></head><body><main>
<img class="logo" src="icone.png" alt="Truth & Verse">
<h1 id="t">TikTok connection</h1>
<p id="m"></p><code id="c" hidden></code><button id="b" hidden>Copy code</button>
<script>
var q=new URLSearchParams(location.search),code=q.get('code'),err=q.get('error');
var t=document.getElementById('t'),m=document.getElementById('m'),c=document.getElementById('c'),b=document.getElementById('b');
if(code){t.textContent='TikTok account connected';m.textContent='Authorization received. Paste this code into the publishing tool on your computer:';c.textContent=code;c.hidden=false;b.hidden=false;
b.onclick=function(){navigator.clipboard.writeText(code).then(function(){b.textContent='Copied'})}}
else if(err){t.textContent='Connection not completed';m.textContent='TikTok returned: '+err+' '+(q.get('error_description')||'')}
else{m.textContent='This page receives the TikTok login for the Truth & Verse publishing tool.'}
</script></main></body></html>
